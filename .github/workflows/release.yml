name: Publish to npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set versions from the tag
        run: node scripts/version.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run check
      - run: npm run pack:packages
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@opentyped'
      - name: Publish validated packages to npm
        run: |
          npm_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then npm_tag=next; fi
          # Publish the shared model first, and skip versions that already exist so reruns are safe.
          for archive in ./.release/opentyped-odb-db-*.tgz $(ls ./.release/*.tgz | grep -v opentyped-odb-db-); do
            spec=$(tar -xOzf "$archive" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
            if npm view "$spec" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$spec already published; skipping"
              continue
            fi
            npm publish "$archive" --registry https://registry.npmjs.org --access public --ignore-scripts --provenance --tag "$npm_tag"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
